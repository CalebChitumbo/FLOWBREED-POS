name: Build Windows Installer

# Windows 7-compatible build: Electron 22, 32-bit (ia32).
# Runs manually from the Actions tab, and automatically on pushes to this branch.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/win7-build
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skip native builds against Node 22 here; electron-builder rebuilds them
      # against Electron 22 (ia32) in the next step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron 22 (ia32)
        run: npm run rebuild

      - name: Build app bundles
        run: npm run build

      - name: Package Windows installer (NSIS, 32-bit)
        run: npx electron-builder --win nsis --ia32 --publish never

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: flowbreeds-pos-win7-installer
          path: release/**/*.exe
          if-no-files-found: error
          retention-days: 90
